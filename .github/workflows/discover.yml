# TEMPORARY: one-shot slug discovery. Delete once collect.py has the confirmed
# slugs baked into its CONFIG block.
name: discover

on:
  push:
    branches: [claude/school-menu-board-build-k130el]
    paths: ['tools/discover.py', '.github/workflows/discover.yml']
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 tools/discover.py
