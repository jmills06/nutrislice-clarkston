<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>School Menu Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top:    #152333;
    --bg-bottom: #0d1620;
    --accent:    #ff7030;
    --cream:     #fdf8e5;
    --card-fill:   rgba(255,255,255,0.05);
    --card-border: rgba(255,255,255,0.10);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px; height: 1920px;
    overflow: hidden;                 /* display-only surface: never scroll */
    background: var(--bg-bottom);
  }

  body {
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    color: var(--cream);
    font-family: 'Source Sans Pro', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Corner glow. A static radial gradient, not a filter -- filters and
     backdrop-filter force continuous recomposites on a Pi. */
  .glow {
    position: fixed; top: -320px; right: -320px;
    width: 900px; height: 900px; pointer-events: none;
    background: radial-gradient(circle,
      rgba(255,112,48,0.20) 0%,
      rgba(255,112,48,0.08) 38%,
      rgba(255,112,48,0.00) 70%);
  }

  #board {
    position: relative;
    display: flex; flex-direction: column;
    width: 1080px; height: 1920px;
    padding: 46px 46px 0;
  }

  /* ---- header ---- */
  header { flex: 0 0 auto; padding-bottom: 26px; }

  .eyebrow { display: flex; align-items: center; gap: 20px; margin-bottom: 14px; }
  .eyebrow .label {
    font-family: 'Oswald', sans-serif; font-weight: 500;
    font-size: 23px; letter-spacing: 7px; text-transform: uppercase;
    color: var(--accent); white-space: nowrap;
  }
  .rule {
    flex: 1 1 auto; height: 2px;
    background: linear-gradient(90deg, rgba(255,112,48,0.85), rgba(255,112,48,0));
  }

  .dateline { display: flex; align-items: baseline; gap: 22px; }
  .weekday {
    font-family: 'Oswald', sans-serif; font-weight: 700;
    font-size: 74px; line-height: 1; letter-spacing: 1px; text-transform: uppercase;
  }
  .datestr {
    font-family: 'Oswald', sans-serif; font-weight: 300;
    font-size: 40px; line-height: 1; color: rgba(253,248,229,0.5);
  }
  .pill {
    font-family: 'Oswald', sans-serif; font-weight: 500;
    font-size: 17px; letter-spacing: 3px; text-transform: uppercase;
    color: #241004; background: var(--accent);
    padding: 6px 14px 5px; border-radius: 999px; white-space: nowrap;
  }

  /* ---- school panels ---- */
  .panels { flex: 1 1 auto; display: flex; flex-direction: column; gap: 22px; min-height: 0; }

  .panel {
    flex: 1 1 0; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--card-fill);
    border: 1px solid var(--card-border);
    border-left: 6px solid var(--panel-accent, var(--accent));
    border-radius: 14px;
    padding: 26px 30px 22px;
  }

  .panel-head { flex: 0 0 auto; display: flex; align-items: baseline; gap: 16px; margin-bottom: 18px; }
  .school-name {
    font-family: 'Oswald', sans-serif; font-weight: 500;
    font-size: 46px; line-height: 1; letter-spacing: 0.5px;
  }
  .school-tag {
    font-family: 'Oswald', sans-serif; font-weight: 300;
    font-size: 17px; letter-spacing: 4px; text-transform: uppercase;
    color: rgba(253,248,229,0.5);
  }

  .section-head { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
  .section-head .txt {
    font-family: 'Oswald', sans-serif; font-weight: 500;
    font-size: 19px; letter-spacing: 5px; text-transform: uppercase;
    color: var(--accent); white-space: nowrap;
  }
  .section-head .rule { height: 1px; }

  .meal { display: flex; flex-direction: column; min-height: 0; }
  .meal.lunch { flex: 1 1 auto; }
  .meal.breakfast { flex: 0 0 auto; margin-top: 20px; }

  .entrees { flex: 0 0 auto; margin-bottom: 14px; }
  .station { margin-bottom: 11px; }
  .station:last-child { margin-bottom: 0; }
  .station-name {
    font-family: 'Oswald', sans-serif; font-weight: 500;
    font-size: 15px; letter-spacing: 3.5px; text-transform: uppercase;
    color: rgba(255,112,48,0.85); margin-bottom: 1px;
  }
  .solo .station-name { font-size: 19px; letter-spacing: 4px; margin-bottom: 3px; }
  .solo .station { margin-bottom: 16px; }
  .entree {
    font-family: 'Oswald', sans-serif; font-weight: 500;
    font-size: 43px; line-height: 1.18; letter-spacing: 0.3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* Chip rows clip rather than grow: the canvas is fixed, so a long side list
     must never push the week strip off the bottom. */
  .chips { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
  .chip {
    font-size: 20px; line-height: 1;
    padding: 8px 13px 9px; border-radius: 8px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.09);
    color: rgba(253,248,229,0.8); white-space: nowrap;
  }
  .meal.breakfast .chips { flex: 0 0 auto; }
  .meal.breakfast .chip { font-size: 18px; padding: 6px 11px 7px; }

  .empty-meal { font-size: 21px; color: rgba(253,248,229,0.4); font-style: italic; }

  /* One line, always. A wrapped staples line steals a whole entree row. */
  .staples {
    flex: 0 0 auto; margin-top: 14px; padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.07);
    font-size: 17px; color: rgba(253,248,229,0.5);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Single-school view: one panel owns the whole canvas, so the type scales up
     to fill it rather than leaving the lower half empty. */
  .solo .school-name { font-size: 56px; }
  .solo .school-tag  { font-size: 19px; }
  .solo .section-head .txt { font-size: 22px; }
  .solo .entree { font-size: 52px; line-height: 1.22; }
  .solo .chip { font-size: 26px; padding: 11px 17px 12px; border-radius: 10px; }
  .solo .meal.breakfast .chip { font-size: 23px; padding: 9px 14px 10px; }
  .solo .staples { font-size: 21px; }
  .solo .entrees { margin-bottom: 20px; }
  /* A solo panel has more room than its content needs. The chip rows stay
     packed -- spreading them apart reads as broken -- and the whole lunch block
     is centred in the leftover height so the slack sits above and below it
     rather than pooling at the bottom of the display. */
  .solo .chips { flex: 0 1 auto; align-content: flex-start; }
  /* Slack collects between lunch and breakfast: content stays anchored under
     the school name, and the breakfast block stays anchored above the staples
     line, which reads better than centring either one in the void. */
  .solo .meal.lunch { margin-bottom: auto; }

  /* ---- week strip ---- */
  .weekstrip { flex: 0 0 auto; margin-top: 22px; }
  .weekgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .daycol { display: flex; flex-direction: column; gap: 8px; }
  .dayname {
    font-family: 'Oswald', sans-serif; font-weight: 500;
    font-size: 16px; letter-spacing: 3px; text-transform: uppercase;
    color: rgba(253,248,229,0.5); text-align: center; padding-bottom: 2px;
  }
  .daycol.is-today .dayname { color: var(--accent); }
  .cell {
    min-height: 62px; padding: 9px 10px;
    border-radius: 10px; border: 1px solid var(--card-border);
    border-top: 3px solid var(--cell-accent, transparent);
    background: rgba(255,255,255,0.04);
    font-size: 15px; line-height: 1.25; color: rgba(253,248,229,0.8);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .daycol.is-today .cell { background: rgba(255,255,255,0.09); }
  .daycol.is-today .dayname::after {
    content: ''; display: block; height: 3px; margin-top: 6px;
    background: var(--accent); border-radius: 2px;
  }
  .cell.no-school { color: rgba(253,248,229,0.28); font-style: italic; }

  /* ---- footer ---- */
  footer {
    flex: 0 0 auto; height: 60px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 15px; color: rgba(253,248,229,0.35);
  }
  footer .warn { color: var(--accent); }

  /* ---- no-data state ---- */
  .nodata {
    flex: 1 1 auto; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; text-align: center;
  }
  .nodata .big {
    font-family: 'Oswald', sans-serif; font-weight: 500;
    font-size: 58px; letter-spacing: 3px; text-transform: uppercase;
    color: rgba(253,248,229,0.75);
  }
  .nodata .sub { font-size: 22px; color: rgba(253,248,229,0.45); }
</style>
</head>
<body>
<div class="glow"></div>
<div id="board"></div>

<script>
(function () {
  'use strict';

  // ---- CONFIG --------------------------------------------------------------
  var SCHOOLS = {
    'springfield-plains': { label: 'Springfield Plains', tag: 'ELEMENTARY', accent: '#ff7030' },
    'sashabaw-middle':    { label: 'Sashabaw Middle',    tag: 'MIDDLE',     accent: '#4a90e2' }
  };

  var VIEW            = 'both';   // 'both' | a school key. Overridable via ?view=
  var SHOW_BREAKFAST  = true;     // set false to reclaim vertical space
  var LUNCH_OVER_HOUR = 13.5;     // after this local hour, roll forward to next serving day
  var REFRESH_MINUTES = 30;       // JSON re-fetch interval
  var STALE_HOURS     = 30;       // older than this flags the footer
  var MAX_ENTREES     = 3;        // hero lines per meal before overflow collapses to chips
  var SOLO_MAX_ENTREES = 6;       // ...and when a single school owns the canvas
  var SHOW_STATIONS    = true;    // group lunch entrees under the kitchen's own
                                  // station names (Grill, 2Mato, Create...)
  var PER_STATION      = 2;       // hero items shown per station
  var SOLO_PER_STATION = 4;       // ...when a single school owns the canvas
  var AUTO_FIT        = false;    // scale 1080x1920 canvas to window, dev only

  var DATA_URL = 'data/latest/menus.json';
  var TICK_MS  = 1000;

  // One deployed file serves three DakBoard blocks: the combined board and each
  // school on its own.
  var qs = new URLSearchParams(window.location.search);
  var viewParam = qs.get('view');
  if (viewParam && (viewParam === 'both' || SCHOOLS[viewParam])) VIEW = viewParam;
  if (qs.get('stations') === '0') SHOW_STATIONS = false;
  if (qs.get('stations') === '1') SHOW_STATIONS = true;
  if (qs.get('breakfast') === '0') SHOW_BREAKFAST = false;
  if (qs.get('breakfast') === '1') SHOW_BREAKFAST = true;
  if (qs.get('autofit') === '1') AUTO_FIT = true;
  var dateOverride = qs.get('date');   // simulate a date, e.g. ?date=2026-08-29

  var DAY_NAMES = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
  var MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];

  var board = document.getElementById('board');

  // ---- state ---------------------------------------------------------------
  var data = null;          // last known good payload
  var fetchFailed = false;  // a fetch failed since the last success
  var lastFetchAt = 0;
  var lastSignature = null;

  // ---- helpers -------------------------------------------------------------

  // Bare YYYY-MM-DD parses as UTC midnight, which lands on the previous day for
  // anyone west of Greenwich. Appending a time forces local-midnight instead.
  function parseLocalDate(iso) { return new Date(iso + 'T00:00:00'); }

  function isoOf(d) {
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function addDays(d, n) {
    var c = new Date(d.getTime());
    c.setDate(c.getDate() + n);
    return c;
  }

  function now() {
    // ?date= shifts the calendar day while keeping the real clock time, so the
    // weekend and roll-forward states can be exercised on the bench.
    if (!dateOverride) return new Date();
    var real = new Date();
    var f = parseLocalDate(dateOverride);
    f.setHours(real.getHours(), real.getMinutes(), real.getSeconds(), 0);
    return f;
  }

  function visibleSchoolKeys() {
    if (VIEW !== 'both' && SCHOOLS[VIEW]) return [VIEW];
    return Object.keys(SCHOOLS).filter(function (k) { return true; });
  }

  function schoolData(key) {
    return (data && data.schools && data.schools[key]) || null;
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  function ruleAfter(node) { node.appendChild(el('div', 'rule')); return node; }

  // ---- day selection -------------------------------------------------------

  function allDatesSorted() {
    var set = {};
    visibleSchoolKeys().forEach(function (k) {
      var sd = schoolData(k);
      if (!sd || !sd.days) return;
      Object.keys(sd.days).forEach(function (iso) { set[iso] = true; });
    });
    return Object.keys(set).sort();
  }

  // Past LUNCH_OVER_HOUR the meal on screen has already been served, so an
  // evening display is only useful if it points at the next serving day. The
  // same forward walk covers weekends, breaks and summer: whatever the reason
  // today is absent from the data, the board shows the next day that is present.
  function pickTargetDate() {
    var n = now();
    var hour = n.getHours() + n.getMinutes() / 60;
    var from = isoOf(hour >= LUNCH_OVER_HOUR ? addDays(n, 1) : n);
    var dates = allDatesSorted();
    for (var i = 0; i < dates.length; i++) {
      if (dates[i] >= from) return { iso: dates[i], todayIso: isoOf(n), checked: dates };
    }
    return { iso: null, todayIso: isoOf(n), checked: dates };
  }

  // ---- rendering -----------------------------------------------------------

  function mealOf(key, iso, meal) {
    var sd = schoolData(key);
    if (!sd || !sd.days || !sd.days[iso]) return null;
    return sd.days[iso][meal] || null;
  }

  function renderHeader(pick) {
    var head = el('header');

    var eyebrow = el('div', 'eyebrow');
    eyebrow.appendChild(el('div', 'label', 'School Menu'));
    ruleAfter(eyebrow);
    head.appendChild(eyebrow);

    var line = el('div', 'dateline');
    if (pick.iso) {
      var d = parseLocalDate(pick.iso);
      line.appendChild(el('div', 'weekday', DAY_NAMES[d.getDay()]));
      line.appendChild(el('div', 'datestr', MONTHS[d.getMonth()] + ' ' + d.getDate()));

      if (pick.iso !== pick.todayIso) {
        var tomorrowIso = isoOf(addDays(parseLocalDate(pick.todayIso), 1));
        // The headline already names the weekday, so repeating it in the pill
        // says nothing; what the pill is for is flagging that the board has
        // rolled off today.
        line.appendChild(el('div', 'pill',
          pick.iso === tomorrowIso ? 'Tomorrow' : 'Next school day'));
      }
    } else {
      var t = parseLocalDate(pick.todayIso);
      line.appendChild(el('div', 'weekday', DAY_NAMES[t.getDay()]));
      line.appendChild(el('div', 'datestr', MONTHS[t.getMonth()] + ' ' + t.getDate()));
    }
    head.appendChild(line);
    return head;
  }

  function isSolo() { return visibleSchoolKeys().length === 1; }

  function renderMeal(bucket, kind, labelText) {
    var wrap = el('div', 'meal ' + kind);

    var sh = el('div', 'section-head');
    sh.appendChild(el('div', 'txt', labelText));
    ruleAfter(sh);
    wrap.appendChild(sh);

    if (!bucket) {
      wrap.appendChild(el('div', 'empty-meal', 'Not served'));
      return wrap;
    }

    var entrees = bucket.entrees || [];
    var sides = (bucket.sides || []).slice();

    if (kind === 'lunch') {
      var cap = isSolo() ? SOLO_MAX_ENTREES : MAX_ENTREES;
      var perStation = isSolo() ? SOLO_PER_STATION : PER_STATION;

      // The kitchen's own grouping says more than a flat list -- "Grill" and
      // "2Mato" are how the students actually read the line. Fall back to the
      // flat entree list when a payload predates stations or has none.
      var entreeStations = (bucket.stations || []).filter(function (st) {
        return st.kind === 'entree' && st.items && st.items.length;
      });

      var box = el('div', 'entrees');
      var overflow = [];

      if (SHOW_STATIONS && entreeStations.length) {
        // Allocate breadth-first: every station gets its first item before any
        // station gets a second. Filling stations in order would let a long
        // Grill list eat the whole cap and drop 2Mato off the board entirely,
        // when what the board is for is showing what is on offer today.
        var taken = entreeStations.map(function () { return []; });
        var shown = 0;
        for (var round = 0; round < perStation && shown < cap; round++) {
          for (var i = 0; i < entreeStations.length && shown < cap; i++) {
            var items = entreeStations[i].items;
            if (items.length > round) { taken[i].push(items[round]); shown++; }
          }
        }
        entreeStations.forEach(function (st, i) {
          st.items.forEach(function (name) {
            if (taken[i].indexOf(name) === -1) overflow.push(name);
          });
          if (!taken[i].length) return;
          var group = el('div', 'station');
          group.appendChild(el('div', 'station-name', st.name));
          taken[i].forEach(function (n) { group.appendChild(el('div', 'entree', n)); });
          box.appendChild(group);
        });
      } else {
        var hero = entrees.slice(0, cap);
        // Entrees beyond the hero cap are not dropped -- they join the chip row,
        // which keeps the panel height fixed while still listing everything.
        overflow = entrees.slice(cap);
        hero.forEach(function (name) { box.appendChild(el('div', 'entree', name)); });
      }

      if (!box.childNodes.length) box.appendChild(el('div', 'empty-meal', 'No entrees listed'));
      wrap.appendChild(box);

      var chips = el('div', 'chips');
      overflow.concat(sides).forEach(function (name) {
        chips.appendChild(el('div', 'chip', name));
      });
      wrap.appendChild(chips);
    } else {
      // Breakfast is compact: one dense chip row, no hero sizing.
      var bchips = el('div', 'chips');
      entrees.concat(sides).forEach(function (name) {
        bchips.appendChild(el('div', 'chip', name));
      });
      if (!entrees.length && !sides.length) {
        bchips.appendChild(el('div', 'empty-meal', 'Not served'));
      }
      wrap.appendChild(bchips);
    }

    return wrap;
  }

  function renderPanel(key, iso) {
    var cfg = SCHOOLS[key];
    var panel = el('div', 'panel');
    panel.style.setProperty('--panel-accent', cfg.accent);

    var head = el('div', 'panel-head');
    head.appendChild(el('div', 'school-name', cfg.label));
    head.appendChild(el('div', 'school-tag', cfg.tag));
    panel.appendChild(head);

    var lunch = iso ? mealOf(key, iso, 'lunch') : null;
    panel.appendChild(renderMeal(lunch, 'lunch', 'Lunch'));

    var breakfast = iso ? mealOf(key, iso, 'breakfast') : null;
    // A school may publish lunch but not breakfast, and that can change between
    // terms, so the block is omitted when the meal is absent rather than
    // rendered as an empty section.
    if (SHOW_BREAKFAST && breakfast) {
      panel.appendChild(renderMeal(breakfast, 'breakfast', 'Breakfast'));
    }

    var staples = [];
    if (lunch && lunch.staples) staples = staples.concat(lunch.staples);
    if (breakfast && breakfast.staples) staples = staples.concat(breakfast.staples);
    var uniq = [];
    staples.forEach(function (s) { if (uniq.indexOf(s) === -1) uniq.push(s); });
    panel.appendChild(el('div', 'staples', uniq.length ? 'Always available: ' + uniq.join(' · ') : ''));

    return panel;
  }

  function renderWeekStrip(pick) {
    var wrap = el('div', 'weekstrip');
    var grid = el('div', 'weekgrid');

    var anchor = parseLocalDate(pick.iso || pick.todayIso);
    // Monday of the displayed week (getDay(): 0 = Sunday).
    var monday = addDays(anchor, -((anchor.getDay() + 6) % 7));
    var keys = visibleSchoolKeys();

    for (var i = 0; i < 5; i++) {
      var d = addDays(monday, i);
      var iso = isoOf(d);
      var col = el('div', 'daycol' + (iso === pick.iso ? ' is-today' : ''));
      col.appendChild(el('div', 'dayname', DAY_NAMES[d.getDay()].slice(0, 3)));

      keys.forEach(function (k) {
        var lunch = mealOf(k, iso, 'lunch');
        var primary = lunch && lunch.entrees && lunch.entrees.length ? lunch.entrees[0] : null;
        var cell = el('div', 'cell' + (primary ? '' : ' no-school'), primary || 'No school');
        cell.style.setProperty('--cell-accent', SCHOOLS[k].accent);
        col.appendChild(cell);
      });

      grid.appendChild(col);
    }

    wrap.appendChild(grid);
    return wrap;
  }

  function renderFooter() {
    var foot = el('footer');
    var left = el('div');
    var right = el('div');

    if (data && data.generated_utc) {
      var gen = new Date(data.generated_utc);
      var ageH = (Date.now() - gen.getTime()) / 3600000;
      var stamp = gen.toLocaleString(undefined, {
        month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
      });
      left.textContent = 'Updated ' + stamp;
      if (ageH > STALE_HOURS) {
        right.className = 'warn';
        right.textContent = 'Data ' + Math.floor(ageH) + 'h old';
      }
    } else {
      left.textContent = 'No menu data loaded';
    }

    // A failed fetch never clears the board -- it only flags the footer, so the
    // last good render stays on screen.
    if (fetchFailed) {
      right.className = 'warn';
      right.textContent = (right.textContent ? right.textContent + ' · ' : '') + 'Update failed';
    }

    foot.appendChild(left);
    foot.appendChild(right);
    return foot;
  }

  function renderNoData(pick) {
    var wrap = el('div', 'nodata');
    wrap.appendChild(el('div', 'big', 'No menus published'));
    if (pick.checked && pick.checked.length) {
      wrap.appendChild(el('div', 'sub',
        'Checked ' + pick.checked[0] + ' through ' + pick.checked[pick.checked.length - 1]));
    } else {
      wrap.appendChild(el('div', 'sub', 'No dates present in the menu feed'));
    }
    return wrap;
  }

  // A cheap content fingerprint. Rebuilding the DOM every tick would churn
  // layout on a device that shows the same pixels for hours at a time.
  function signatureOf(pick) {
    var parts = [pick.iso || 'none', VIEW, isSolo() ? 'solo' : 'duo',
                 SHOW_BREAKFAST ? 'b1' : 'b0', SHOW_STATIONS ? 'st1' : 'st0',
                 fetchFailed ? 'f1' : 'f0', data ? data.generated_utc : 'nodata'];
    var anchor = parseLocalDate(pick.iso || pick.todayIso);
    var monday = addDays(anchor, -((anchor.getDay() + 6) % 7));
    visibleSchoolKeys().forEach(function (k) {
      for (var i = 0; i < 5; i++) {
        var iso = isoOf(addDays(monday, i));
        var l = mealOf(k, iso, 'lunch');
        parts.push(k + iso + (l && l.entrees ? l.entrees.join('|') : '') +
          (l && l.stations ? l.stations.map(function (x) {
            return x.name + ':' + (x.items || []).join(','); }).join(';') : ''));
      }
      var bm = pick.iso ? mealOf(k, pick.iso, 'breakfast') : null;
      if (bm) parts.push(k + 'bk' + (bm.entrees || []).join('|') + (bm.sides || []).join('|'));
    });
    // Stale-ness can flip without the payload changing, so fold it in.
    if (data && data.generated_utc) {
      parts.push(((Date.now() - new Date(data.generated_utc).getTime()) / 3600000) > STALE_HOURS ? 's1' : 's0');
    }
    return parts.join('~');
  }

  function render() {
    var pick = pickTargetDate();
    var sig = signatureOf(pick);
    if (sig === lastSignature) return;
    lastSignature = sig;

    board.textContent = '';
    board.className = isSolo() ? 'solo' : '';
    board.appendChild(renderHeader(pick));

    if (!pick.iso) {
      board.appendChild(renderNoData(pick));
      board.appendChild(renderFooter());
      return;
    }

    var panels = el('div', 'panels');
    visibleSchoolKeys().forEach(function (k) { panels.appendChild(renderPanel(k, pick.iso)); });
    board.appendChild(panels);

    board.appendChild(renderWeekStrip(pick));
    board.appendChild(renderFooter());
  }

  // ---- data ----------------------------------------------------------------

  function loadData() {
    lastFetchAt = Date.now();
    // Same-origin relative fetch, cache-busted: DakBoard and the Pi's own HTTP
    // stack will otherwise serve a cached copy for hours.
    fetch(DATA_URL + '?v=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (json) {
        if (!json || !json.schools) throw new Error('malformed payload');
        data = json;
        fetchFailed = false;
        lastSignature = null;   // force one rebuild on fresh data
        render();
      })
      .catch(function () {
        fetchFailed = true;
        render();               // keeps the last good content, flags the footer
      });
  }

  // ---- master tick ---------------------------------------------------------
  // One interval drives the clock, the roll-forward check, the age display and
  // the fetch trigger. Competing timers on an always-on display drift apart and
  // wake the CPU more often than the content justifies.
  function tick() {
    if (Date.now() - lastFetchAt >= REFRESH_MINUTES * 60000) loadData();
    render();
  }

  function applyAutoFit() {
    if (!AUTO_FIT) return;
    var fit = function () {
      var s = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
      document.body.style.transformOrigin = 'top left';
      document.body.style.transform = 'scale(' + s + ')';
    };
    fit();
    window.addEventListener('resize', fit);
  }

  applyAutoFit();
  render();          // paint the empty//no-data frame immediately
  loadData();
  setInterval(tick, TICK_MS);
})();
</script>
</body>
</html>
